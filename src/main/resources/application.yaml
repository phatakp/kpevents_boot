spring:
  application:
    name: kpevents

  datasource:
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:imintcs3}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kpevents_db}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true

